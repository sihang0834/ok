<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, sortObjects: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 【請注意】將 src="./your-image.png" 改成你想在名片上浮現的那張圖片檔名 -->
        <img id="card-img" src="./115405135_林思行_profile2.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        
        <!-- width="0.7" height="1" 符合你名片的直式比例，圖片就不會變形 -->
        <!-- position="0 0 0" 代表圖片會浮在整張名片的正中央 -->
        <a-image src="#card-img" position="0 0 0" width="0.7" height="1"></a-image>
        
      
    </a-scene>
    
  </body>
</html>
